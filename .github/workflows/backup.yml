name: Daily Automated Database Backup

on:
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup-db:
    name: Backup Database & Generate Manifest
    runs-on: ubuntu-latest
    # Least privilege: the backup job only needs repo contents. The DATABASE_URL
    # secret should belong to a backup-only Postgres role (SELECT-only, no
    # DDL/DML) — never a superuser connection string.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute database backup snapshot
        run: npm run db:backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Backup Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-dump
          path: backups/
          # Short retention: dumps contain user PII (emails, watchlists,
          # usage profiles). Anyone with Actions read access can download
          # artifacts — keep the window minimal.
          retention-days: 7
