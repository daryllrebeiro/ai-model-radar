name: CI Test & Build Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_model_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        run: npm run db:init
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_model_radar_test
          NODE_ENV: test

      - name: Run Vitest unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_model_radar_test
          NODE_ENV: test
          ADMIN_SECRET: test-admin-secret

      - name: Cleanup test database
        if: always()
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ai_model_radar_test \
            -c "TRUNCATE model_snapshots, model_events, ingestion_runs, api_keys, digest_deliveries, users, user_watchlists, alert_rules, schema_migrations CASCADE;"

      - name: Run Next.js production build
        run: npm run build
        env:
          NODE_ENV: production
