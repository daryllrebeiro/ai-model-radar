name: Scheduled Database Raw JSON Pruning

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  prune-db:
    name: Prune 30-Day Raw JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute database pruning job
        run: npm run db:prune
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRUNE_DAYS: 30
